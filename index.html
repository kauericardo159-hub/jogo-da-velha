<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha Multiplayer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; margin-top: 50px; }
        .tabuleiro { display: inline-grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 5px; margin-top: 20px; }
        .casa { width: 100px; height: 100px; background-color: #333; border: 2px solid #555; font-size: 2.5rem; font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .casa:hover { background-color: #444; }
        #status { margin-top: 20px; font-size: 1.2rem; color: #00ffcc; }
    </style>
</head>
<body>

    <h1>Jogo da Velha Online</h1>
    <div id="status">Conectando ao nosso servidor...</div>

    <div class="tabuleiro" id="tabuleiro">
        <div class="casa" data-index="0"></div>
        <div class="casa" data-index="1"></div>
        <div class="casa" data-index="2"></div>
        <div class="casa" data-index="3"></div>
        <div class="casa" data-index="4"></div>
        <div class="casa" data-index="5"></div>
        <div class="casa" data-index="6"></div>
        <div class="casa" data-index="7"></div>
        <div class="casa" data-index="8"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // ATENÇÃO: Depois que criarmos o servidor no Render, 
        // vamos substituir esse link abaixo pelo link do SEU servidor!
        const URL_SERVIDOR = "https://jogo-da-velha-t0jl.onrender.com";
        
        const socket = io(URL_SERVIDOR); 
        let meuSimbolo = ""; 
        let meuTurno = false;
        const casas = document.querySelectorAll('.casa');
        const statusText = document.getElementById('status');

        socket.on('connect', () => {
            statusText.innerText = "Conectado! Aguardando oponente...";
        });

        socket.on('player-assignment', (simbolo) => {
            meuSimbolo = simbolo;
            if (meuSimbolo === "X") {
                statusText.innerText = "Você é o 'X'. Aguardando amigo entrar...";
                meuTurno = true;
            } else {
                statusText.innerText = "Você é o 'O'. Seu amigo joga primeiro.";
                meuTurno = false;
            }
        });

        socket.on('start-game', () => {
            statusText.innerText = meuTurno ? "O jogo começou! Sua vez (X)." : "O jogo começou! Vez do amigo (X).";
        });

        casas.forEach(casa => {
            casa.addEventListener('click', () => {
                if (!meuTurno || casa.innerText !== "") return;
                const index = casa.getAttribute('data-index');
                casa.innerText = meuSimbolo;
                meuTurno = false;
                statusText.innerText = "Aguardando o amigo...";
                socket.emit('make-move', { index: index, simbolo: meuSimbolo });
            });
        });

        socket.on('move-made', (dados) => {
            if (dados.simbolo !== meuSimbolo) {
                casas[dados.index].innerText = dados.simbolo;
                meuTurno = true;
                statusText.innerText = `Seu amigo jogou! Sua vez (${meuSimbolo}).`;
            }
        });

        socket.on('player-disconnected', () => {
            statusText.innerText = "O outro jogador saiu. Reinicie a página.";
        });
    </script>
</body>
</html>
