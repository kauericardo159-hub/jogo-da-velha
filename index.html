<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Velha Multiplayer - Pro</title>
    <style>
        /* Estilos Integrados Avançados com Tema Neon Cyberpunk */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c12;
            color: #e1e1e6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            margin-bottom: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Badge do Perfil Logado no Topo */
        .global-user-header {
            display: flex;
            align-items: center;
            background: #14141d;
            border: 1px solid #8257e5;
            box-shadow: 0 0 12px rgba(130, 87, 229, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            margin-bottom: 25px;
        }
        .global-user-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #8257e5;
            margin-right: 12px;
        }
        .global-user-name {
            font-weight: bold;
            color: #fff;
            font-size: 0.95rem;
        }

        /* Containers Principais */
        .container-lobby, #area-jogo {
            background-color: #14141d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 2rem;
            width: 360px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        #area-jogo { display: none; }

        h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #0c0c12;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #00f0ff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        #btn-criar {
            background-color: #00f0ff;
            color: #0c0c12;
            box-shadow: 0 4px 12px rgba(0, 240, 255, 0.2);
        }
        #btn-criar:hover { background-color: #61f7ff; }

        .lista-salas {
            margin-top: 15px;
            max-height: 180px;
            overflow-y: auto;
        }

        /* Slot da Sala com Foto do Dono */
        .item-sala {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .sala-info-bloco {
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        .sala-dono-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #00f0ff;
            object-fit: cover;
            margin-right: 10px;
            background: #0c0c12;
        }
        .sala-detalhes {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
        }
        .item-sala button {
            width: auto;
            padding: 6px 12px;
            background-color: #8257e5;
            color: white;
            font-size: 0.8rem;
        }

        /* Placar Dinâmico Com Avatares dentro da Sala */
        .placar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        .player {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.6;
            transition: all 0.2s;
        }
        .player.ativo {
            opacity: 1;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            background: rgba(0, 240, 255, 0.02);
        }
        .placar-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 6px;
            background: #0c0c12;
        }
        .player.ativo .placar-avatar {
            border-color: #00f0ff;
        }
        .score-num {
            font-size: 1.2rem;
            font-weight: bold;
            color: #04d361;
            margin-top: 4px;
        }

        #status {
            text-align: center;
            font-weight: 600;
            color: #a8a8b3;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        /* Tabuleiro */
        .tabuleiro {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background-color: rgba(255,255,255,0.03);
            padding: 8px;
            border-radius: 8px;
        }
        .casa {
            height: 100px;
            background-color: #0c0c12;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }
        .casa:hover { background-color: #181824; }
        .casa[data-venceu="true"] { color: #04d361; background-color: rgba(4, 211, 97, 0.1); }

        .btn-sair {
            background: transparent;
            color: #ff4b4b;
            border: 1px solid rgba(255, 75, 75, 0.3);
        }
        .btn-sair:hover { background: rgba(255, 75, 75, 0.1); }
    </style>
</head>
<body>

    <div class="global-user-header">
        <img id="headerAvatar" class="global-user-img" src="" alt="Avatar">
        <span id="headerNome" class="global-user-name">Carregando...</span>
    </div>

    <h1>Neon Tic-Tac-Toe 🕹️</h1>

    <div class="container-lobby" id="tela-lobby">
        <h3>Criar uma Sala</h3>
        <input type="text" id="input-sala" placeholder="Nome da sala...">
        <button id="btn-criar">Criar e Entrar</button>

        <h3 style="margin-top: 25px;">Salas Disponíveis</h3>
        <div class="lista-salas" id="lista-salas-container">
            <div style="color: #7c7c8a; text-align: center;">Nenhuma sala ativa no momento.</div>
        </div>
    </div>

    <div id="area-jogo">
        <div class="placar">
            <div class="player" id="p1-display">
                <img id="p1-avatar" class="placar-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="P1">
                <span id="p1-name" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px;">Aguardando...</span>
                <span class="score-num" id="score-x">0</span>
            </div>
            <div class="player" id="p2-display">
                <img id="p2-avatar" class="placar-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="P2">
                <span id="p2-name" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px;">Aguardando...</span>
                <span class="score-num" id="score-o">0</span>
            </div>
        </div>

        <div id="status">Conectando...</div>

        <div class="tabuleiro" id="tabuleiro">
            <div class="casa" data-index="0"></div>
            <div class="casa" data-index="1"></div>
            <div class="casa" data-index="2"></div>
            <div class="casa" data-index="3"></div>
            <div class="casa" data-index="4"></div>
            <div class="casa" data-index="5"></div>
            <div class="casa" data-index="6"></div>
            <div class="casa" data-index="7"></div>
            <div class="casa" data-index="8"></div>
        </div>
        <br>
        <button class="btn-sair" id="btn-sair">Sair da Sala</button>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // --- INSTÂNCIA INTEGRADA DO BANCO DE DADOS LOCAL ---
        const ContaSistema = {
            STORAGE_KEY: 'meu_game_user_account',
            dadosPadrao: {
                nome: "Jogador_Novo",
                gender: "masculino",
                foto: "https://cdn-icons-png.flaticon.com/512/149/149071.png",
                modelo3d: ""
            },
            carregar: function() {
                const dadosSalvos = localStorage.getItem(this.STORAGE_KEY);
                if (dadosSalvos) {
                    const parsed = JSON.parse(dadosSalvos);
                    return {
                        nome: parsed.nome || this.dadosPadrao.nome,
                        foto: parsed.foto || this.dadosPadrao.foto
                    };
                }
                return this.dadosPadrao;
            }
        };

        // Carrega dados locais na Inicialização da Página
        const meuPerfilLocal = ContaSistema.carregar();
        document.getElementById('headerAvatar').src = meuPerfilLocal.foto;
        document.getElementById('headerNome').textContent = meuPerfilLocal.nome;

        // --- SISTEMA MULTIPLAYER (Socket.io) ---
        const URL_SERVIDOR = "https://jogo-da-velha-t0jl.onrender.com"; 
        const socket = io(URL_SERVIDOR);

        let minhaSala = "";
        let meuSimbolo = ""; 
        let meuTurno = false;
        let vitoriasX = 0;
        let vitoriasO = 0;
        let tabuleiroEstado = ["", "", "", "", "", "", "", "", ""];

        const casas = document.querySelectorAll('.casa');
        const statusText = document.getElementById('status');
        const lobby = document.getElementById('tela-lobby');
        const jogoArea = document.getElementById('area-jogo');

        // Recebe e renderiza as salas disponíveis mostrando o avatar do dono
        socket.on('lista-salas', (salas) => {
            const container = document.getElementById('lista-salas-container');
            container.innerHTML = "";
            if (salas.length === 0) {
                container.innerHTML = '<div style="color: #7c7c8a; text-align: center;">Nenhuma sala ativa. Crie uma!</div>';
                return;
            }
            salas.forEach(sala => {
                if (sala.jogadores < 2) {
                    // Pega a foto do dono transmitida pelo servidor (ou usa a padrão se indisponível)
                    const fotoDono = sala.donoFoto || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                    const nomeDono = sala.donoNome || "Desconhecido";

                    const item = document.createElement('div');
                    item.className = 'item-sala';
                    item.innerHTML = `
                        <div class="sala-info-bloco">
                            <img class="sala-dono-avatar" src="${fotoDono}" alt="Dono">
                            <div class="sala-detalhes">
                                <span><b>${sala.nome}</b></span>
                                <span style="font-size:0.75rem; color:#a8a8b3;">Dono: ${nomeDono} (${sala.jogadores}/2)</span>
                            </div>
                        </div>
                        <button onclick="entrarNaSala('${sala.nome}')">Entrar</button>
                    `;
                    container.appendChild(item);
                }
            });
        });

        document.getElementById('btn-criar').addEventListener('click', () => {
            const nomeSala = document.getElementById('input-sala').value.trim();
            if (nomeSala) entrarNaSala(nomeSala);
        });

        function entrarNaSala(nomeSala) {
            minhaSala = nomeSala;
            lobby.style.display = "none";
            jogoArea.style.display = "block";
            statusText.innerText = "Entrando na sala...";

            // MODIFICAÇÃO PRO: Envia os dados estruturados da conta para o Servidor Multiplayer sincronizar
            socket.emit('entrar-na-sala', {
                sala: minhaSala,
                jogadorNome: meuPerfilLocal.nome,
                jogadorFoto: meuPerfilLocal.foto
            });
        }

        document.getElementById('btn-sair').addEventListener('click', () => {
            socket.emit('sair-da-sala', minhaSala);
            location.reload();
        });

        socket.on('player-assignment', (dados) => {
            // Nota: Se o seu servidor legado enviar apenas a string do símbolo ("X" ou "O") em vez de um objeto,
            // essa condicional garante retrocompatibilidade inteligente.
            const simbolo = typeof dados === 'object' ? dados.simbolo : dados;
            meuSimbolo = simbolo;

            if (simbolo === "X") {
                statusText.innerText = "Você é o Player 1 (X). Aguardando oponente...";
                document.getElementById('p1-name').innerText = meuPerfilLocal.nome;
                document.getElementById('p1-avatar').src = meuPerfilLocal.foto;
                document.getElementById('p1-display').classList.add('ativo');
                meuTurno = true;
            } else {
                statusText.innerText = "Você é o Player 2 (O). Sincronizando partida...";
                document.getElementById('p2-name').innerText = meuPerfilLocal.nome;
                document.getElementById('p2-avatar').src = meuPerfilLocal.foto;
                document.getElementById('p2-display').classList.add('ativo');
                meuTurno = false;
            }
        });

        // Evento que recebe dados dos perfis da sala quando a partida inicia
        socket.on('room-info', (info) => {
            if (info.p1) {
                document.getElementById('p1-name').innerText = info.p1.nome;
                document.getElementById('p1-avatar').src = info.p1.foto;
            }
            if (info.p2) {
                document.getElementById('p2-name').innerText = info.p2.nome;
                document.getElementById('p2-avatar').src = info.p2.foto;
            }
        });

        socket.on('start-game', () => {
            resgatarVez();
        });

        casas.forEach(casa => {
            casa.addEventListener('click', () => {
                const idx = casa.getAttribute('data-index');
                if (!meuTurno || tabuleiroEstado[idx] !== "") return;

                fazerJogadaLocal(idx, meuSimbolo);
                socket.emit('make-move', { sala: minhaSala, index: idx, simbolo: meuSimbolo });
            });
        });

        socket.on('move-made', (dados) => {
            fazerJogadaLocal(dados.index, dados.simbolo);
        });

        function fazerJogadaLocal(index, simbolo) {
            tabuleiroEstado[index] = simbolo;
            casas[index].innerText = simbolo;
            meuTurno = (simbolo !== meuSimbolo);
            
            if (!checarResultado()) {
                resgatarVez();
            }
        }

        function resgatarVez() {
            statusText.innerText = meuTurno ? "Sua vez de jogar!" : "Vez do oponente...";
            document.getElementById('p1-display').classList.toggle('ativo', meuTurno && meuSimbolo === "X" || !meuTurno && meuSimbolo === "O");
            document.getElementById('p2-display').classList.toggle('ativo', meuTurno && meuSimbolo === "O" || !meuTurno && meuSimbolo === "X");
        }

        function checarResultado() {
            const caminhosVitoria = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            for (const caminho of caminhosVitoria) {
                const [a, b, c] = caminho;
                if (tabuleiroEstado[a] && tabuleiroEstado[a] === tabuleiroEstado[b] && tabuleiroEstado[a] === tabuleiroEstado[c]) {
                    finalizarRodada(tabuleiroEstado[a], caminho);
                    return true;
                }
            }

            if (!tabuleiroEstado.includes("")) {
                finalizarRodada("Empate");
                return true;
            }
            return false;
        }

        function finalizarRodada(vencedor, caminhoGanhador = null) {
            meuTurno = false;
            
            if (vencedor === "Empate") {
                statusText.innerText = "A rodada empatou! Reiniciando em 3 segundos...";
            } else {
                if (caminhoGanhador) {
                    caminhoGanhador.forEach(i => casas[i].setAttribute('data-venceu', 'true'));
                }
                if (vencedor === "X") vitoriasX++;
                if (vencedor === "O") vitoriasO++;

                document.getElementById('score-x').innerText = vitoriasX;
                document.getElementById('score-o').innerText = vitoriasO;

                statusText.innerText = vencedor === meuSimbolo ? "Você venceu esta rodada!" : "Oponente venceu esta rodada!";
            }

            setTimeout(() => {
                if (vitoriasX === 3 || vitoriasO === 3) {
                    const campeao = vitoriasX === 3 ? "Player 1 (X)" : "Player 2 (O)";
                    alert(`🏆 FIM DE JOGO! O grande campeão foi o ${campeao}!`);
                    location.reload();
                } else {
                    proximaRodada();
                }
            }, 3000);
        }

        function proximaRodada() {
            tabuleiroEstado = ["", "", "", "", "", "", "", "", ""];
            casas.forEach(casa => {
                casa.innerText = "";
                casa.removeAttribute('data-venceu');
            });
            meuTurno = (meuSimbolo === "O" && (vitoriasX + vitoriasO) % 2 !== 0) || (meuSimbolo === "X" && (vitoriasX + vitoriasO) % 2 === 0);
            resgatarVez();
        }

        socket.on('player-disconnected', () => {
            statusText.innerText = "Oponente desconectou. Você venceu por W.O!";
            setTimeout(() => location.reload(), 4000);
        });
    </script>
</body>
</html>
