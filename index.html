<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arcade Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Neon Tic-Tac-Toe 🕹️</h1>

    <div class="server-stats">
        <span><span class="stat-dot"></span> Online: <b id="count-online">0</b></span>
        <span>|</span>
        <span>🎮 Jogando: <b id="count-jogando">0</b></span>
    </div>

    <div class="main-layout">
        
        <div class="card-panel" id="tela-lobby">
            
            <h3>Seu Perfil</h3>
            <div class="profile-preview">
                <img id="avatar-preview" class="avatar-img" src="https://i.imgur.com/6VBx3io.png" alt="Avatar">
                <div class="profile-inputs">
                    <input type="text" id="input-nome" placeholder="Seu apelido..." value="Jogador">
                    <input type="text" id="input-avatar-url" placeholder="URL da imagem/GIF...">
                    <label class="file-input-label">
                        📁 Carregar Arquivo
                        <input type="file" id="input-avatar-file" accept="image/*" style="display: none;">
                    </label>
                </div>
            </div>

            <hr style="border-color: var(--card-border); margin: 20px 0;">

            <h3>Criar uma Sala</h3>
            <input type="text" id="input-sala" class="sala-input" placeholder="Nome da sala...">
            <button id="btn-criar">Criar / Entrar</button>

            <h3>Salas Disponíveis</h3>
            <div class="lista-salas" id="lista-salas-container">
                <div style="color: #7c7c8a; text-align: center; padding: 10px;">Nenhuma sala ativa. Crie uma!</div>
            </div>
        </div>

        <div class="card-panel" id="area-jogo">
            <div class="placar">
                <div class="player-card" id="p1-display">
                    <img id="p1-img" class="player-avatar" src="https://i.imgur.com/6VBx3io.png">
                    <span id="p1-nome">Player 1</span>
                    <div>(X): <b id="score-x">0</b></div>
                </div>

                <div style="font-size: 1.5rem; font-weight: bold; color: var(--neon-pink);">VS</div>

                <div class="player-card" id="p2-display">
                    <img id="p2-img" class="player-avatar" src="https://i.imgur.com/6VBx3io.png">
                    <span id="p2-nome">Aguardando...</span>
                    <div>(O): <b id="score-o">0</b></div>
                </div>
            </div>

            <div id="status">Conectando...</div>

            <div class="tabuleiro" id="tabuleiro">
                <div class="casa" data-index="0"></div>
                <div class="casa" data-index="1"></div>
                <div class="casa" data-index="2"></div>
                <div class="casa" data-index="3"></div>
                <div class="casa" data-index="4"></div>
                <div class="casa" data-index="5"></div>
                <div class="casa" data-index="6"></div>
                <div class="casa" data-index="7"></div>
                <div class="casa" data-index="8"></div>
            </div>
            <br>
            <button class="btn-sair" id="btn-sair">Sair da Sala</button>
        </div>

    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const socket = io(); // Conecta dinamicamente ao servidor atual no Render

        // Dados de perfil e jogo
        let perfilLocal = {
            nome: localStorage.getItem('neon_nome') || "Jogador_" + Math.floor(Math.random() * 899 + 100),
            avatar: localStorage.getItem('neon_avatar') || "https://i.imgur.com/6VBx3io.png"
        };

        let minhaSala = "";
        let meuSimbolo = ""; 
        let meuTurno = false;
        let vitoriasX = 0;
        let vitoriasO = 0;
        let tabuleiroEstado = ["", "", "", "", "", "", "", "", ""];
        let oponentePerfil = { nome: "Oponente", avatar: "https://i.imgur.com/6VBx3io.png" };

        // Elementos do DOM
        const inputNome = document.getElementById('input-nome');
        const inputAvatarUrl = document.getElementById('input-avatar-url');
        const inputAvatarFile = document.getElementById('input-avatar-file');
        const avatarPreview = document.getElementById('avatar-preview');
        const casas = document.querySelectorAll('.casa');
        const statusText = document.getElementById('status');
        const lobby = document.getElementById('tela-lobby');
        const jogoArea = document.getElementById('area-jogo');

        // Inicializa entradas do Perfil
        inputNome.value = perfilLocal.nome;
        avatarPreview.src = perfilLocal.avatar;

        function salvarEEnviarPerfil() {
            localStorage.setItem('neon_nome', perfilLocal.nome);
            localStorage.setItem('neon_avatar', perfilLocal.avatar);
            socket.emit('atualizar-perfil', perfilLocal);
        }

        // Eventos do Perfil
        inputNome.addEventListener('change', () => {
            perfilLocal.nome = inputNome.value.trim() || "Jogador";
            salvarEEnviarPerfil();
        });

        inputAvatarUrl.addEventListener('change', () => {
            if (inputAvatarUrl.value.trim() !== "") {
                perfilLocal.avatar = inputAvatarUrl.value.trim();
                avatarPreview.src = perfilLocal.avatar;
                salvarEEnviarPerfil();
            }
        });

        inputAvatarFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    perfilLocal.avatar = evt.target.result;
                    avatarPreview.src = perfilLocal.avatar;
                    salvarEEnviarPerfil();
                };
                reader.readAsDataURL(file);
            }
        });

        socket.on('connect', () => {
            salvarEEnviarPerfil();
        });

        // Atualização de Estatísticas Globais
        socket.on('status-global', (dados) => {
            document.getElementById('count-online').innerText = dados.online;
            document.getElementById('count-jogando').innerText = dados.jogando;
        });

        // Receber salas ativas
        socket.on('lista-salas', (salas) => {
            const container = document.getElementById('lista-salas-container');
            container.innerHTML = "";
            if (salas.length === 0) {
                container.innerHTML = '<div style="color: #7c7c8a; text-align: center; padding: 10px;">Nenhuma sala ativa. Crie uma!</div>';
                return;
            }
            salas.forEach(sala => {
                if (sala.jogadores < 2) {
                    const item = document.createElement('div');
                    item.className = 'item-sala';
                    item.innerHTML = `<span><b>${sala.nome}</b> (${sala.jogadores}/2)</span>
                                      <button onclick="entrarNaSala('${sala.nome}')">Entrar</button>`;
                    container.appendChild(item);
                }
            });
        });

        document.getElementById('btn-criar').addEventListener('click', () => {
            const nome = document.getElementById('input-sala').value.trim();
            if (nome) entrarNaSala(nome);
        });

        function entrarNaSala(nome) {
            minhaSala = nome;
            lobby.style.display = "none";
            jogoArea.style.display = "block";
            statusText.innerText = "Entrando na sala...";
            socket.emit('entrar-na-sala', { nomeSala: minhaSala });
        }

        document.getElementById('btn-sair').addEventListener('click', () => {
            socket.emit('sair-da-sala', minhaSala);
            location.reload();
        });

        socket.on('player-assignment', (dados) => {
            meuSimbolo = dados.simbolo;
            
            if (meuSimbolo === "X") {
                document.getElementById('p1-nome').innerText = perfilLocal.nome;
                document.getElementById('p1-img').src = perfilLocal.avatar;
                statusText.innerText = "Aguardando oponente...";
                meuTurno = true;
            } else {
                document.getElementById('p2-nome').innerText = perfilLocal.nome;
                document.getElementById('p2-img').src = perfilLocal.avatar;
                
                // Pega dados do P1 que já estava na sala
                const p1 = dados.jogadores.find(j => j.simbolo === "X");
                if (p1) {
                    document.getElementById('p1-nome').innerText = p1.nome;
                    document.getElementById('p1-img').src = p1.avatar;
                }
                statusText.innerText = "Você entrou! Aguardando jogo iniciar...";
                meuTurno = false;
            }
        });

        socket.on('oponente-entrou', (oponente) => {
            if (meuSimbolo === "X") {
                document.getElementById('p2-nome').innerText = oponente.nome;
                document.getElementById('p2-img').src = oponente.avatar;
            }
        });

        socket.on('start-game', (dados) => {
            const p1 = dados.jogadores.find(j => j.simbolo === "X");
            const p2 = dados.jogadores.find(j => j.simbolo === "O");

            if (p1) {
                document.getElementById('p1-nome').innerText = p1.nome;
                document.getElementById('p1-img').src = p1.avatar;
            }
            if (p2) {
                document.getElementById('p2-nome').innerText = p2.nome;
                document.getElementById('p2-img').src = p2.avatar;
            }

            resgatarVez();
        });

        casas.forEach(casa => {
            casa.addEventListener('click', () => {
                const idx = casa.getAttribute('data-index');
                if (!meuTurno || tabuleiroEstado[idx] !== "") return;

                fazerJogadaLocal(idx, meuSimbolo);
                socket.emit('make-move', { sala: minhaSala, index: idx, simbolo: meuSimbolo });
            });
        });

        socket.on('move-made', (dados) => {
            fazerJogadaLocal(dados.index, dados.simbolo);
        });

        function fazerJogadaLocal(index, simbolo) {
            tabuleiroEstado[index] = simbolo;
            casas[index].innerText = simbolo;
            casas[index].style.color = simbolo === "X" ? "var(--neon-cyan)" : "var(--neon-pink)";
            meuTurno = (simbolo !== meuSimbolo);
            
            if (!checarResultado()) {
                resgatarVez();
            }
        }

        function resgatarVez() {
            statusText.innerText = meuTurno ? "Sua vez de jogar!" : "Vez do oponente...";
            document.getElementById('p1-display').classList.toggle('ativo', (meuTurno && meuSimbolo === "X") || (!meuTurno && meuSimbolo === "O"));
            document.getElementById('p2-display').classList.toggle('ativo', (meuTurno && meuSimbolo === "O") || (!meuTurno && meuSimbolo === "X"));
        }

        function checarResultado() {
            const caminhosVitoria = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            for (const caminho of caminhosVitoria) {
                const [a, b, c] = caminho;
                if (tabuleiroEstado[a] && tabuleiroEstado[a] === tabuleiroEstado[b] && tabuleiroEstado[a] === tabuleiroEstado[c]) {
                    finalizarRodada(tabuleiroEstado[a], caminho);
                    return true;
                }
            }

            if (!tabuleiroEstado.includes("")) {
                finalizarRodada("Empate");
                return true;
            }
            return false;
        }

        function finalizarRodada(vencedor, caminhoGanhador = null) {
            meuTurno = false;
            
            if (vencedor === "Empate") {
                statusText.innerText = "A rodada empatou! Reiniciando...";
            } else {
                if (caminhoGanhador) {
                    caminhoGanhador.forEach(i => casas[i].setAttribute('data-venceu', 'true'));
                }
                if (vencedor === "X") vitoriasX++;
                if (vencedor === "O") vitoriasO++;

                document.getElementById('score-x').innerText = vitoriasX;
                document.getElementById('score-o').innerText = vitoriasO;

                statusText.innerText = vencedor === meuSimbolo ? "🏆 Você venceu esta rodada!" : "❌ Oponente venceu a rodada!";
            }

            setTimeout(() => {
                if (vitoriasX === 3 || vitoriasO === 3) {
                    const campeao = vitoriasX === 3 ? "Player 1 (X)" : "Player 2 (O)";
                    alert(`🏆 FIM DE JOGO! O grande campeão foi ${campeao}!`);
                    location.reload();
                } else {
                    proximaRodada();
                }
            }, 3000);
        }

        function proximaRodada() {
            tabuleiroEstado = ["", "", "", "", "", "", "", "", ""];
            casas.forEach(casa => {
                casa.innerText = "";
                casa.removeAttribute('data-venceu');
            });
            meuTurno = (meuSimbolo === "O" && (vitoriasX + vitoriasO) % 2 !== 0) || (meuSimbolo === "X" && (vitoriasX + vitoriasO) % 2 === 0);
            resgatarVez();
        }

        socket.on('player-disconnected', () => {
            statusText.innerText = "Oponente desconectou! Você venceu por W.O!";
            setTimeout(() => location.reload(), 3500);
        });
    </script>
</body>
</html>
